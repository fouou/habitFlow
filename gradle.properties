# Project-wide Gradle settings

# JVM heap for Gradle daemon & R8 (fixes OutOfMemoryError during minify/release build)
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX must be enabled — this project uses androidx.* libraries exclusively
android.useAndroidX=true
android.enableJetifier=false

# AGP 9 defaults
android.builtInKotlin=false
android.defaults.buildfeatures.resvalues=true
android.dependency.useConstraints=true
android.enableAppCompileTimeRClass=false
android.newDsl=false
android.r8.optimizedResourceShrinking=false
android.r8.strictFullModeForKeepRules=false
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.uniquePackageNames=false
android.usesSdkInManifest.disallowed=false

# Enabled parallel sync for Gradle
org.gradle.tooling.parallel=true

# Let AGP/Gradle auto-download the required JDK 21 toolchain
android.java.installations.auto-download=true
org.gradle.java.installations.auto-download=true
# HabitFlow Cloudflare Worker (AI insights backend). The worker proxies DeepSeek, so the
# real DeepSeek key lives server-side in the worker — it is NO LONGER shipped in the app.
# workerApiToken + workerBaseUrl are kept in local.properties (gitignored) — DO NOT commit them here.
